name: Build & Release APK + IPA

# 云端 macOS runner 构建双端安装包并发布到 GitHub Releases：
#   - Android: release APK（debug 签名，可直接安装）
#   - iOS: 未签名 IPA（需 Sideloadly/AltStore/TrollStore 自签）
#
# 触发：推送到 main 分支，或在 GitHub Actions 页面手动 Run workflow
# 每次构建自动顺延版本号 patch（1.3.0+4 → 1.3.1+5 → 1.3.2+6 …）

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 需要完整历史来生成 changelog

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---- 自动顺延版本号 ----
      # 读取 pubspec.yaml 中的 version，patch+1、build+1
      - name: Bump version
        id: bump
        run: |
          # 提取当前版本号
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "Current version: $CURRENT"

          VERSION_PART=$(echo "$CURRENT" | cut -d '+' -f 1)   # 1.3.0
          BUILD_PART=$(echo "$CURRENT" | cut -d '+' -f 2)     # 4

          MAJOR=$(echo "$VERSION_PART" | cut -d '.' -f 1)
          MINOR=$(echo "$VERSION_PART" | cut -d '.' -f 2)
          PATCH=$(echo "$VERSION_PART" | cut -d '.' -f 3)

          # patch +1, build +1
          NEW_PATCH=$((PATCH + 1))
          NEW_BUILD=$((BUILD_PART + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}+${NEW_BUILD}"

          echo "New version: $NEW_VERSION"
          # 更新 pubspec.yaml
          sed -i '' "s/^version:.*/version: $NEW_VERSION/" pubspec.yaml
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$NEW_BUILD" >> "$GITHUB_OUTPUT"

      - name: Flutter doctor
        run: flutter --version

      # 仓库只含 lib/ + pubspec + 关键 manifest；云端补齐 iOS/Android 平台脚手架
      - name: Scaffold platforms
        run: flutter create . --platforms=ios,android,web --org com.nce.checkin --project-name nce_checkin

      - name: Pull deps
        run: flutter pub get

      # ---- 注入固定 debug.keystore（保证每次编译签名一致，可覆盖安装）----
      # GitHub Actions runner 每次都是全新环境，默认 keystore 每次不同 → 签名不一致 → 无法覆盖安装
      # 三重保险保证签名指纹恒定：
      #   1. 复制到 ~/.android/debug.keystore（默认 debug 签名约定位置）
      #   2. 写 android/key.properties 指向仓库内固定 keystore
      #   3. 显式注入 release signingConfig 到 build.gradle，release 构建强制使用固定 keystore
      - name: Setup fixed debug keystore
        run: |
          # 0. 从 base64 文本还原 keystore 二进制（仓库只存 .b64 文本，避免二进制入库）
          python3 -c "import base64,pathlib; pathlib.Path('signing/debug.keystore').write_bytes(base64.b64decode(pathlib.Path('signing/debug.keystore.b64').read_text()))"

          # 1. 默认约定位置
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

          # 2. key.properties（相对 android/app/ 解析到仓库根 signing/）
          cat > android/key.properties <<'EOF'
storePassword=android
keyPassword=android
keyAlias=androiddebugkey
storeFile=../../signing/debug.keystore
EOF

          # 3. 显式注入 release signingConfig + 让 release 使用它
          python3 - <<'PYEOF'
import pathlib
p = pathlib.Path('android/app/build.gradle')
s = p.read_text()

# 注入 keystoreProperties 读取逻辑（仅在不存在时）
if 'keystoreProperties' not in s:
    header = (
        "def keystoreProperties = new Properties()\n"
        "def keystorePropertiesFile = rootProject.file('key.properties')\n"
        "if (keystorePropertiesFile.exists()) {\n"
        "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
        "}\n\n"
    )
    s = header + s

# 注入 signingConfigs.release 块（仅在不存在时）
injected_release = False
if 'signingConfigs {' not in s:
    sc = (
        "    signingConfigs {\n"
        "        release {\n"
        "            keyAlias keystoreProperties['keyAlias']\n"
        "            keyPassword keystoreProperties['keyPassword']\n"
        "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
        "            storePassword keystoreProperties['storePassword']\n"
        "        }\n"
        "    }\n"
    )
    if '    buildTypes {' in s:
        s = s.replace('    buildTypes {', sc + '    buildTypes {', 1)
        injected_release = True

# 仅在成功注入 release 配置时，才把 release 构建改用固定签名
# （否则保持 debug 签名，它也用 ~/.android/debug.keystore 固定 keystore）
if injected_release:
    s = s.replace('signingConfig signingConfigs.debug',
                  'signingConfig signingConfigs.release')

p.write_text(s)
print('=== Patched android/app/build.gradle signing config ===')
print('release signingConfig injected:', injected_release)
PYEOF

          echo "=== Keystore fingerprint (固定，每次编译一致) ==="
          keytool -list -v -keystore signing/debug.keystore -storepass android 2>/dev/null | grep SHA256

      # ---------------- iOS 未签名 IPA ----------------
      - name: Build & package unsigned iOS app
        run: |
          set +e
          flutter build ios --release --no-codesign
          set -e

          # 收集所有 Runner.app 路径
          find build/ios ~/Library/Developer/Xcode/DerivedData \
            -name "Runner.app" -type d 2>/dev/null > /tmp/runner_apps.txt

          echo "=== All Runner.app found ==="
          while IFS= read -r p; do
            size=$(du -sh "$p" 2>/dev/null | cut -f1)
            has_flutter="no"
            [ -d "$p/Frameworks/Flutter.framework" ] && has_flutter="YES"
            echo "  $size | Flutter.framework=$has_flutter | $p"
          done < /tmp/runner_apps.txt

          # 优先选含 Flutter.framework 的完整 app
          APP_PATH=""
          while IFS= read -r p; do
            [ -d "$p/Frameworks/Flutter.framework" ] && { APP_PATH="$p"; break; }
          done < /tmp/runner_apps.txt

          # 回退：选体积最大的 Runner.app
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(while IFS= read -r p; do du -sh "$p" 2>/dev/null; done < /tmp/runner_apps.txt \
              | sort -rh | head -1 | cut -f2-)
          fi

          echo "Selected app: $APP_PATH"
          test -n "$APP_PATH"
          echo "Selected app size: $(du -sh "$APP_PATH" | cut -f1)"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -RL "$APP_PATH" build/Payload/
          cd build
          zip -qr "nce_checkin_${{ steps.bump.outputs.version }}_ios.ipa" Payload
          cd ..
          cp "build/nce_checkin_${{ steps.bump.outputs.version }}_ios.ipa" .
          ls -lh *.ipa

      # ---------------- Android APK ----------------
      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "nce_checkin_${{ steps.bump.outputs.version }}_android.apk"
          ls -lh *.apk

      # ---------------- 上传构建产物 (Artifacts) ----------------
      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: nce_checkin_${{ steps.bump.outputs.version }}_ios.ipa
          retention-days: 30

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: nce_checkin_${{ steps.bump.outputs.version }}_android.apk
          retention-days: 30

      # ---------------- 生成 Release Notes ----------------
      - name: Generate release notes
        id: notes
        run: |
          # 从上次 tag 到现在的 commit 历史
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "$LAST_TAG"..HEAD 2>/dev/null)
          else
            COMMITS=$(git log --pretty=format:"- %s" -20)
          fi

          VERSION="${{ steps.bump.outputs.version }}"

          cat > release_notes.md <<EOF
# 新概念英语打卡 v${VERSION}

## 安装说明

### Android
下载 \`.apk\` 文件直接安装。

### iOS
下载 \`.ipa\` 文件，需使用 [Sideloadly](https://sideloadly.io/)、[AltStore](https://altstore.io/) 或 TrollStore 等工具自签后安装。

## 更新日志
${COMMITS}
EOF

          cat release_notes.md
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          cat release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ---------------- 创建 GitHub Release ----------------
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: 新概念英语打卡 v${{ steps.bump.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            nce_checkin_${{ steps.bump.outputs.version }}_android.apk
            nce_checkin_${{ steps.bump.outputs.version }}_ios.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- 回写版本号到仓库 ----------------
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}" || echo "No changes to commit"
          git push
