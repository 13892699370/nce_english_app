name: nce_checkin
description: 新概念英语学习打卡 App - 纯本地存储，双端兼容（Android / iOS）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Hive 本地存储（双端兼容）
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
